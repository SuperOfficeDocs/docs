StylesPath = vale
MinAlertLevel = suggestion

Vocab = SuperOffice

Packages = Microsoft, MDX

[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Vale, Microsoft, Formatting

# House style keeps trailing punctuation outside closing quotes (logical
# style), the opposite of Microsoft.Quotes' American-style suggestion.
# Confirmed by direct correction after 4 instances were "fixed" the wrong
# way during the issue #246 style audit.
Microsoft.Quotes = NO

# Translated content: real spellcheck via Hunspell dictionaries (see
# vale/config/dictionaries/NOTICE.md), plus formatting — no English
# Microsoft prose/voice rules, those don't apply to non-English text.
[da/**]
BasedOnStyles = Formatting, DA

[de/**]
BasedOnStyles = Formatting, DE

[nl/**]
BasedOnStyles = Formatting, NL

# "no" folder = Norwegian Bokmal (nb_NO), the standard written form
[no/**]
BasedOnStyles = Formatting, NB

[sv/**]
BasedOnStyles = Formatting, SV

# Generated reference content: no prose linting at all
[{en/api/archive-providers/reference,en/api/mdo-providers/reference,en/api/reference,en/automation/crmscript/reference,en/database/tables,release-notes/database}/**]
BasedOnStyles =

# English-only, never-translated, contributor/technical folders. Contractions
# are allowed here per writing-baseline's folder exception (see ai-agents
# skills/writing-baseline/SKILL.md): Microsoft.Contractions was previously
# firing unopposed with no override, a gap found and closed via issue #246.
[{contribute,integrations,release-notes}/**]
Microsoft.Contractions = NO

# contribute/ is git/JSON/HTTP contributor documentation for a technical
# audience, not general-audience prose. "URL" is the precise, correct term
# throughout (reviewed line-by-line for issue #246; every hit was a technical
# reference, none read as consumer-facing copy).
[contribute/**]
Microsoft.GeneralURL = NO

# Raw MDX `import ... from "...";` lines get parsed as English prose by
# default (a real JS statement, not a sentence). This was silently
# mis-flagging Microsoft.Semicolon on legitimate import lines (issue #246).
[*.mdx]
BlockIgnores = '((?m:^import .+;$)|(?s:```mdx\n.*?\n```))'
