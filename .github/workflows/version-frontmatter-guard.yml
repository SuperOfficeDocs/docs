name: Reserved version frontmatter auto-fix

on:
  pull_request:
    branches: [main]

# Automatically cancel in-progress runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fix-reserved-version-property:
    name: "Rename version: to so_version: on changed files"
    runs-on: ubuntu-latest
    # A fork PR's default token can't push back to the fork - skip cleanly
    # rather than fail loudly. Same-repo branches proceed as usual.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Get changed files
        id: changed
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **/*.md
            **/*.mdx
          files_ignore: |
            **/reference/**
            en/database/tables/**
            release-notes/api/**
            blueprint-templates/**
            api-sources/**
            downloads/**
            tools/benchmarks/results/**

      - name: Set up Python
        if: steps.changed.outputs.any_changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: "Rename reserved version: property on changed files"
        if: steps.changed.outputs.any_changed == 'true'
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.all_changed_files }}
        run: python tools/ci/fix-reserved-version-property.py --apply $CHANGED_FILES

      - name: Commit and push fix, if any
        if: steps.changed.outputs.any_changed == 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then
            echo "No version: -> so_version: rename needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Rename reserved version: frontmatter to so_version: (#254)"
          git push origin "HEAD:$HEAD_REF"
