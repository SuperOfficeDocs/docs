name: Markdownlint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Automatically cancel in-progress runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdownlint:
    name: Lint changed Markdown/MDX files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **/*.md
            **/*.mdx
          files_ignore: |
            **/reference/**
            en/database/tables/**
            release-notes/api/**
            release-notes/database/**
            blueprint-templates/**
            api-sources/**
            downloads/**
            tools/benchmarks/results/**

      - name: Set up Node
        if: steps.changed.outputs.any_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install markdownlint-cli2
        if: steps.changed.outputs.any_changed == 'true'
        run: npm install -g markdownlint-cli2

      - name: Run markdownlint-cli2 on changed files
        if: steps.changed.outputs.any_changed == 'true'
        continue-on-error: true
        # The changed-files list is untrusted PR-diff content (attacker-controlled
        # filenames). Pass it through env instead of interpolating the `${{ }}`
        # expression directly into the run script; direct interpolation is a
        # known GitHub Actions script-injection vector, since the expression is
        # substituted into the shell script's source text before bash parses it.
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.all_changed_files }}
        run: markdownlint-cli2 $CHANGED_FILES
