name: WebAPI bare-relative links auto-fix

on:
  pull_request:
    branches: [main]
    paths:
      - "en/api/reference/webapi/**/*.md"
      - "en/api/reference/webapi/**/*.mdx"

# Automatically cancel in-progress runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fix-webapi-bare-relative-links:
    name: "Rewrite bare-relative links in en/api/reference/webapi/"
    runs-on: ubuntu-latest
    # A fork PR's default token can't push back to the fork - skip cleanly
    # rather than fail loudly. Same-repo branches proceed as usual.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: "Rewrite bare-relative links in en/api/reference/webapi/"
        # Scans the whole (small, ~2,500-file) tree rather than only this
        # PR's changed files: a giant regenerated-content drop can touch
        # every file in the tree at once (this repo's own fix PR did, and
        # promptly broke this exact step trying to pass that file list
        # through a workflow env var -- "Argument list too long"), and the
        # script is idempotent, so a full scan costs a few seconds and
        # avoids depending on a changed-files list at any size.
        run: python tools/ci/fix-webapi-bare-relative-links.py --apply

      - name: Commit and push fix, if any
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then
            echo "No bare-relative links to rewrite."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Rewrite bare-relative links in en/api/reference/webapi/ (#400)"
          git push origin "HEAD:$HEAD_REF"
