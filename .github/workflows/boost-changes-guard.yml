name: Boost changes guard

on:
  pull_request:
    branches: [main]

# Automatically cancel in-progress runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  boost-changes-guard:
    name: "Notify on boost frontmatter/config changes"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **/*.md
            **/*.mdx
            config/nav-*.json
            docs.json

      - name: Set up Python
        if: steps.changed.outputs.any_changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: "Check changed files for boost additions/changes"
        id: check
        if: steps.changed.outputs.any_changed == 'true'
        # The changed-files list is untrusted PR-diff content (attacker-controlled filenames). Pass it
        # through env instead of interpolating the `${{ }}` expression directly into the run script;
        # direct interpolation is a known GitHub Actions script-injection vector, since the expression is
        # substituted into the shell script's source text before bash parses it.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHANGED_FILES: ${{ steps.changed.outputs.all_changed_files }}
        run: git diff "$BASE_SHA" HEAD -- $CHANGED_FILES | python tools/ci/check-boost-changes.py

      - name: "Comment on the PR"
        if: steps.check.outputs.boost_changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const summary = process.env.BOOST_SUMMARY;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `@digitaldiina this PR adds or changes a \`boost\` value:\n\n${summary}\n\nSee [Metadata][1] for Mintlify's guidance on valid ranges before merging.\n\n[1]: https://docs.superoffice.com/contribute/markdown-guide/metadata`,
            });
        env:
          BOOST_SUMMARY: ${{ steps.check.outputs.boost_summary }}
