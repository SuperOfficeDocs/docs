name: Boost changes guard

on:
  pull_request:
    branches: [main]

# Automatically cancel in-progress runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # only for the comment step below

jobs:
  boost-changes-guard:
    name: "Notify on boost frontmatter/config changes"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check for newly added/changed boost values
        id: check
        run: python tools/ci/check-boost-changes.py --base-ref origin/main

      - name: "Comment on the PR (create once, then update)"
        if: steps.check.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            // One comment per PR, found by a hidden marker: a new push edits it in place
            // instead of posting another and re-notifying the reviewer each time (#554).
            const marker = '<!-- boost-changes-guard -->';
            const changed = process.env.BOOST_CHANGED === 'true';
            const summary = process.env.BOOST_SUMMARY;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            // Bot-authored only, so a human quoting the marker is never edited or deleted.
            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));

            if (!changed) {
              // A later push removed every boost change: don't leave a stale warning.
              if (existing) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
              }
              return;
            }

            const body = (mention) => `${marker}\n${mention}This PR adds or changes a \`boost\` value:\n\n${summary}\n\nSee [Metadata][1] for Mintlify's guidance on valid ranges before merging.\n\n[1]: https://docs.superoffice.com/contribute/markdown-guide/metadata`;

            if (existing) {
              // No mention on update, so the reviewer is only notified once.
              const updated = body('');
              if (existing.body !== updated) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: updated });
              }
              return;
            }

            // The reviewer to notify is a repository variable, not a literal handle in
            // tracked source: a public GitHub @-mention notifies and links to a real
            // profile, so it doesn't belong in a file anyone can read. Falls back to no
            // mention at all if the variable isn't set, rather than posting a broken one.
            const mention = process.env.BOOST_GUARD_MENTION ? `${process.env.BOOST_GUARD_MENTION} ` : '';
            await github.rest.issues.createComment({ owner, repo, issue_number, body: body(mention) });
        env:
          BOOST_CHANGED: ${{ steps.check.outputs.boost_changed }}
          BOOST_SUMMARY: ${{ steps.check.outputs.boost_summary }}
          BOOST_GUARD_MENTION: ${{ vars.BOOST_GUARD_MENTION }}
